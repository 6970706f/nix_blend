[package]
name = "nix_blend"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
rustix = { version = "1.1.6", default-features = false, features = ["std", "process", "thread", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.5"
thiserror = "2.0.21"
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "display", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "nixblend"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
